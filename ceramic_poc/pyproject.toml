[project]
name = "ceramic-tile-poc"
version = "0.1.0"
description = "Normal-only PatchCore feasibility experiment"
requires-python = ">=3.11,<3.12"
dependencies = [
  "anomalib==2.6.2",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "gradio>=5.49,<7",
  "pillow>=11,<13",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.9,<4",
  "httpx>=0.28,<1",
]
[project.scripts]
ceramic-poc = "ceramic_poc.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["ceramic_poc"]
[project.optional-dependencies]
cuda = ["torch==2.8.0", "torchvision==0.23.0"]
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'win32'" }]
