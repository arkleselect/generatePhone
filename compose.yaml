# Publish only to loopback: this application intentionally has no multi-user authentication.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hamlab
      MYSQL_USER: hamlab
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hamlab?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      DB_USER: hamlab
      DB_PASSWORD: ${DB_PASSWORD}
    volumes: [./data:/app/data]
    depends_on:
      mysql: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
volumes:
  mysql-data:
